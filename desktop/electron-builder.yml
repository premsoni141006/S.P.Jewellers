appId: in.spjewellers.estimate
productName: SP Jewellers Estimate
copyright: S.P. Jewellers
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: SPJewellers-Estimate-Setup-${version}.${ext}
  # Not code-signed: Windows SmartScreen will show "More info → Run anyway" on first install.
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SP Jewellers Estimate
  uninstallDisplayName: SP Jewellers Estimate
  deleteAppDataOnUninstall: false
mac:
  target: dir
